                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Ukrainian", name: "ua", widget: "string" }

              - label: "Text"
                name: "text"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Ukrainian", name: "ua", widget: "text" }

              - label: "Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Number", name: "number", widget: "string" }

                  - label: "Title One"
                    name: "title-one"
                    widget: "object"
                    required: false
                    fields:
                      - {
                          label: "English",
                          name: "en",
                          widget: "string",
                          required: false,
                        }
                      - {
                          label: "Ukrainian",
                          name: "ua",
                          widget: "string",
                          required: false,
                        }

                  - label: "Text One"
                    name: "text-one"
                    widget: "object"
                    required: false
                    fields:
                      - {
                          label: "English",
                          name: "en",
                          widget: "text",
                          required: false,
                        }
                      - {
                          label: "Ukrainian",
                          name: "ua",
                          widget: "text",
                          required: false,
                        }

                  - label: "Title Two"
                    name: "title-two"
                    widget: "object"
                    required: false
                    fields:
                      - {
                          label: "English",
                          name: "en",
                          widget: "string",
                          required: false,
                        }
                      - {
                          label: "Ukrainian",
                          name: "ua",
                          widget: "string",
                          required: false,
                        }

                  - label: "Text Two"
                    name: "text-two"
                    widget: "object"
                    required: false
                    fields:
                      - {
                          label: "English",
                          name: "en",
                          widget: "text",
                          required: false,
                        }
                      - {
                          label: "Ukrainian",
                          name: "ua",
                          widget: "text",
                          required: false,
                        }

                  - label: "Title Three"
                    name: "title-three"
                    widget: "object"
                    required: false
                    fields:
                      - {
                          label: "English",
                          name: "en",
                          widget: "string",
                          required: false,
                        }
                      - {
                          label: "Ukrainian",
                          name: "ua",
                          widget: "string",
                          required: false,
                        }

                  - label: "Text Three"
                    name: "text-three"
                    widget: "object"
                    required: false
                    fields:
                      - {
                          label: "English",
                          name: "en",
                          widget: "text",
                          required: false,
                        }
                      - {
                          label: "Ukrainian",
                          name: "ua",
                          widget: "text",
                          required: false,
                        }

          - label: "Workshops Section"
            name: "workshops"
            widget: "object"
            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Ukrainian", name: "ua", widget: "string" }

              - label: "Button"
                name: "button"
                widget: "object"
                fields:
                  - label: "Label"
                    name: "label"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Ukrainian", name: "ua", widget: "string" }

          - label: "Subscription"
            name: "subscription"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Ukrainian", name: "ua", widget: "string" }

              - label: "Text"
                name: "text"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Ukrainian", name: "ua", widget: "text" }

              - label: "Placeholder"
