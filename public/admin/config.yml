                  - { label: "Ukrainian", name: "ua", widget: "string" }

              - label: "Button Label"
                name: "buttonLabel"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Ukrainian", name: "ua", widget: "string" }

      - name: "shop_page"
        label: "Shop Page"
        file: "src/content/pages/shop-page.json"
        format: "json"
        fields:
          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Ukrainian", name: "ua", widget: "string" }

              - label: "Description"
                name: "description"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Ukrainian", name: "ua", widget: "text" }

              - { label: "SEO Image", name: "image", widget: "image" }

              - label: "Image Alt"
                name: "imageAlt"
