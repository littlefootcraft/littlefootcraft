          - { label: "English", name: "en", widget: "text" }
          - { label: "Ukrainian", name: "ua", widget: "text" }

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Brooch Making", value: "brooch-making" }

      - label: "Duration"
        name: "duration"
        widget: "object"
        fields:
          - {
              label: "Value",
              name: "value",
              widget: "number",
              value_type: "int",
