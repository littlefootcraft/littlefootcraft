  - name: "workshops"
    label: "Workshops"
    folder: "src/content/pages/workshops"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title.en"
    slug: "{{fields.slug.en}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }

      - label: "Slug"
        name: "slug"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Ukrainian", name: "ua", widget: "string" }

      - label: "Title"
        name: "title"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Ukrainian", name: "ua", widget: "string" }

      - label: "Subtitle"
        name: "subtitle"
        widget: "object"
