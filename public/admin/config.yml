                  - { label: "Ukrainian", name: "ua", widget: "string" }

              - label: "Text"
                name: "text"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Ukrainian", name: "ua", widget: "text" }

              - label: "Image"
                name: "image"
                widget: "object"
                fields:
                  - { label: "Image", name: "src", widget: "image" }
                  - label: "Alt"
                    name: "alt"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Ukrainian", name: "ua", widget: "string" }

              - label: "Button"
                name: "button"
                widget: "object"
                fields:
                  - label: "Label"
                    name: "label"
                    widget: "object"
                    fields:
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Ukrainian", name: "ua", widget: "string" }

          - label: "Process Section"
