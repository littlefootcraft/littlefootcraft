      - label: "Currency"
        name: "currency"
        widget: "select"
        options:
          - "EUR"
          - "USD"
          - "GBP"

      - label: "Includes"
        name: "includes"
        widget: "object"
        fields:
          - label: "English"
            name: "en"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }

          - label: "Ukrainian"
            name: "ua"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }

      - label: "Upcoming Dates"
        name: "upcomingDates"
        widget: "object"
        fields:
          - label: "Title"
            name: "title"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Ukrainian", name: "ua", widget: "string" }

          - label: "Dates"
            name: "dates"
            widget: "list"
            field:
              label: "Date"
              name: "date"
              widget: "datetime"
              format: "YYYY-MM-DD"
              date_format: "YYYY-MM-DD"
              time_format: false

      - label: "Description"
        name: "description"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "text" }
          - { label: "Ukrainian", name: "ua", widget: "text" }

      - label: "Image"
        name: "image"
        widget: "object"
        fields:
          - { label: "Image", name: "src", widget: "image" }

          - label: "Alt"
            name: "alt"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Ukrainian", name: "ua", widget: "string" }

      - label: "Badges"
        name: "badges"
        widget: "object"
        fields:
