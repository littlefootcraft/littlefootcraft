backend:
  name: git-gateway
  branch: develop
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
- name: "settings"
    label: "Site Settings"
    files:
      - name: "navigation"
        label: "Navigation Settings"
        file: "public/content/settings/navigation.json"
        fields:
          - label: "Show Sale Page"
            name: "showSalePage"
            widget: "boolean"
            default: true
