              - { label: "Ukrainian", name: "ua", widget: "string" }

          - label: "Empty State"
            name: "emptyState"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Ukrainian", name: "ua", widget: "string" }

      - name: "workshops_page"
        label: "Workshops Page"
        file: "src/content/pages/workshops-page.json"
        format: "json"
        fields:
          - { label: "Slug", name: "slug", widget: "string" }

          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Ukrainian", name: "ua", widget: "string" }

              - label: "Description"
                name: "description"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "text" }
                  - { label: "Ukrainian", name: "ua", widget: "text" }

              - { label: "SEO Image", name: "image", widget: "image" }

              - label: "Image Alt"
                name: "imageAlt"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Ukrainian", name: "ua", widget: "string" }

          - label: "Top Section"
            name: "top"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Ukrainian", name: "ua", widget: "string" }

              - label: "Text"
