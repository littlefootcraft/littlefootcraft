backend:
  name: git-gateway
  branch: develop

media_folder: "public/uploads/images"
public_folder: "/uploads/images"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "navigation"
        label: "Navigation Settings"
        file: "src/content/settings/navigation.json"
        format: "json"
        fields:
          - label: "Show Sale Page"
            name: "showSalePage"
            widget: "boolean"
            default: true
      - name: "store_config"
        label: "Store Config"
        file: "src/content/store-config.json"
        format: "json"
        fields:
          - label: "Currency"
            name: "currency"
            widget: "object"
            fields:
              - label: "Active Currency"
                name: "active"
                widget: "select"
                options:
                  - { label: "Euro (€)", value: "EUR" }
                  - { label: "Ukrainian Hryvnia (₴)", value: "UAH" }
  - name: "product_collections"
    label: "Product Collections"
    folder: "src/content/collections"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name.en"
    slug: "{{fields.id}}"
    fields:
      - label: "Collection ID"
        name: "id"
        widget: "string"
        hint:
          "Use lowercase English words with hyphens. No spaces.
          Example:   ocean-blue, bloom-spell, cozy-purr-club."

      - label: "Name"
        name: "name"
        widget: "object"
        hint: "This name will be shown on the website."
        fields:
          - {
              label: "English",
              name: "en",
              widget: "string",
              hint: "Example: Ocean   Blue",
            }
          - {
              label: "Ukrainian",
              name: "ua",
              widget: "string",
              hint: "Example:   Океанська синява",
            }

      - label: "Image"
        name: "image"
        widget: "image"
        required: false
        hint:
          "Optional. Used for collection cards on the homepage.
          Recommended:   square or horizontal image."

  - name: "pages"
    label: "Pages"
    files:
      # HOME PAGE
      - name: "home_page"
        label: "Home Page"
        file: "src/content/pages/home-page.json"
        format: "json"
        fields:
