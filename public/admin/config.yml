                      - { label: "Ukrainian", name: "ua", widget: "text" }

      - name: "about_page"
        label: "About Page"
        file: "src/content/pages/about-page.json"
        format: "json"

        fields:
          - { label: "Slug", name: "slug", widget: "string" }

          # SEO
          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Ukrainian", name: "ua", widget: "string" }
              - label: "Description"
                name: "description"
                widget: "object"
                fields:
