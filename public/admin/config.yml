  # BAGS
  - name: "bags"
    label: "Bags"
    folder: "src/content/shop/bags"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name.en"
    slug: "{{fields.sku}}"

    fields:
      - label: "SKU"
        name: "sku"
        widget: "string"
        hint:
          "SKU format: BAMMDD-001. BA = Bag. Example: BA0326-004 means bag made
          on March 26, item number 4."
      - label: "SEO"
        name: "seo"
        widget: "object"
        fields:
          - label: "Title"
            name: "title"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Ukrainian", name: "ua", widget: "string" }

          - label: "Description"
            name: "description"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "text" }
              - { label: "Ukrainian", name: "ua", widget: "text" }

          - label: "Image Alt"
            name: "imageAlt"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Ukrainian", name: "ua", widget: "string" }

      - label: "Name"
        name: "name"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Ukrainian", name: "ua", widget: "string" }

      - label: "Specifications"
        name: "specifications"
        widget: "object"
        fields:
          - label: "Category"
            name: "category"
            widget: "object"
            fields:
              - {
                  label: "English",
                  name: "en",
                  widget: "string",
                  default: "Brooch",
                }
              - {
                  label: "Ukrainian",
                  name: "ua",
                  widget: "string",
                  default: "Брошка",
                }

          - label: "Size"
            name: "size"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Ukrainian", name: "ua", widget: "string" }

          - label: "Colors"
            name: "color"
            widget: "select"
            multiple: true
            options:
              - gold
              - pink
              - brown
              - blue
              - red
              - yellow
              - green
              - black
              - white
              - purple
              - multicolor

          - label: "Collection"
            name: "collection"
            widget: "relation"
            collection: "product_collections"
            search_fields: ["name.en", "name.ua", "id"]
            value_field: "id"
            display_fields: ["name.en"]
            required: false
            hint: "Choose from collections created in Product Collections."

      - label: "Description"
        name: "description"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "text" }
          - { label: "Ukrainian", name: "ua", widget: "text" }

      - { label: "Price", name: "price", widget: "number", value_type: "int" }

      - label: "Old Price"
        name: "oldPrice"
        widget: "number"
        value_type: "int"
        required: false

      - label: "Badges"
        name: "badges"
        widget: "object"
        fields:
          - { label: "Top", name: "isTop", widget: "boolean", default: false }
          - { label: "New", name: "isNew", widget: "boolean", default: false }

      - label: "Video"
        name: "video"
        widget: "object"
        required: false
        fields:
          - {
              label: "Video File",
              name: "src",
              widget: "file",
              required: false,
            }
          - label: "Alt"
            name: "alt"
            widget: "object"
            required: false
            hint:
              "Describe what is shown in the video for accessibility and SEO."
            fields:
              - {
                  label: "English",
                  name: "en",
                  widget: "string",
                  required: false,
                  hint: "Example: Jellyfish brooch shimmering under light",
                }
              - {
                  label: "Ukrainian",
                  name: "ua",
                  widget: "string",
                  required: false,
                  hint: "Приклад: Брошка-медуза мерехтить на світлі",
                }

      - label: "Photos"
        name: "photo"
        widget: "list"
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - label: "Alt"
            name: "alt"
            widget: "object"
            hint: "Describe the image for accessibility and SEO."
            fields:
              - {
                  label: "English",
                  name: "en",
                  widget: "string",
                  hint: "Example: Jellyfish brooch front view",
                }
              - {
                  label: "Ukrainian",
                  name: "ua",
                  widget: "string",
                  hint: "Приклад: Брошка-медуза спереду",
                }

  # WORKSOPS
  - name: "workshops"
    label: "Workshops"
    folder: "src/content/workshops"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "id"
    slug: "{{fields.id}}"
    hint:
      "Use lowercase words with hyphens, for example:
      introduction-to-brooch-making"
    fields:
      - { label: "ID", name: "id", widget: "string" }

      - label: "Title"
        name: "title"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Ukrainian", name: "ua", widget: "string" }

      - label: "Subtitle"
        name: "subtitle"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "text" }
          - { label: "Ukrainian", name: "ua", widget: "text" }

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Brooch Making", value: "brooch-making" }

      - label: "Duration"
        name: "duration"
        widget: "object"
        fields:
          - {
              label: "Value",
              name: "value",
              widget: "number",
              value_type: "int",
            }

          - label: "Unit"
            name: "unit"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Ukrainian", name: "ua", widget: "string" }

      - label: "Participants"
        name: "participants"
        widget: "object"
        fields:
          - label: "Text"
            name: "text"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Ukrainian", name: "ua", widget: "string" }
          - {
              label: "Amount of People",
              name: "amount-of-people",
              widget: "number",
              value_type: "int",
            }
      - label: "Location Type"
        name: "location"
        widget: "object"
        hint: "Example: In person / Особиста зустріч"
        fields:
          - {
              label: "English",
              name: "en",
              widget: "string",
              default: "In person",
            }
          - {
              label: "Ukrainian",
              name: "ua",
              widget: "string",
              default: "Особиста зустріч",
            }

      - label: "Exact Location"
        name: "exactLocation"
        widget: "object"
        hint:
          "Example: Galway, Ireland. Full address will be shared after booking
          confirmation."
        fields:
          - { label: "English", name: "en", widget: "text" }
          - { label: "Ukrainian", name: "ua", widget: "text" }

      - label: "Workshop Time"
        name: "time"
        widget: "object"
        hint: "Example: 11:00 AM – 2:00 PM / 11:00 – 14:00"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Ukrainian", name: "ua", widget: "string" }

      - { label: "Price", name: "price", widget: "number", value_type: "int" }
      - label: "Currency"
        name: "currency"
        widget: "select"
        options:
          - "EUR"
          - "USD"
          - "GBP"

      - label: "Includes"
        name: "includes"
        widget: "object"
        fields:
          - label: "English"
            name: "en"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }

          - label: "Ukrainian"
            name: "ua"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }

      - label: "Upcoming Dates"
        name: "upcomingDates"
        widget: "object"
        fields:
          - label: "Title"
            name: "title"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Ukrainian", name: "ua", widget: "string" }

          - label: "Dates"
            name: "dates"
            widget: "list"
            field:
              label: "Date"
              name: "date"
              widget: "datetime"
              format: "YYYY-MM-DD"
              date_format: "YYYY-MM-DD"
              time_format: false

      - label: "Description"
        name: "description"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "text" }
          - { label: "Ukrainian", name: "ua", widget: "text" }

      - label: "Image"
        name: "image"
        widget: "object"
        fields:
          - { label: "Image", name: "src", widget: "image" }

          - label: "Alt"
            name: "alt"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Ukrainian", name: "ua", widget: "string" }

      - label: "Badges"
        name: "badges"
        widget: "object"
        fields:
          - {
              label: "Featured",
              name: "isFeatured",
              widget: "boolean",
              default: false,
            }
          - { label: "New", name: "isNew", widget: "boolean", default: false }

      - { label: "Active", name: "isActive", widget: "boolean", default: true }

