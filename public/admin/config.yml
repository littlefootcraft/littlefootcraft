                  - { label: "Ukrainian", name: "ua", widget: "text" }
              - { label: "SEO Image", name: "image", widget: "image" }
              - label: "SEO Image Alt"
                name: "imageAlt"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Ukrainian", name: "ua", widget: "string" }

            # Top Section
          - label: "Top Section"
            name: "top"
            widget: "object"
            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Ukrainian", name: "ua", widget: "string" }
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
