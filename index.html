<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link
    rel="icon"
    type="image/png"
    href="/uploads/images/favicon.png"
  />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>LittleFootCraft | Handmade Fantasy Jewelry & Magical Treasures</title>

  <meta
    name="description"
    content="Discover handcrafted fantasy-inspired jewelry, brooches, accessories, and magical treasures made with love and imagination."
  />

  <!-- Open Graph / Facebook -->
  <meta
    property="og:type"
    content="website"
  />
  <meta
    property="og:title"
    content="LittleFootCraft"
  />
  <meta
    property="og:description"
    content="Handcrafted fantasy-inspired jewelry, brooches, and magical treasures."
  />
  <meta
    property="og:image"
    content="https://littlefootcraft.art/uploads/images/socialMedia_image.jpg"
  />
  <meta
    property="og:image:secure_url"
    content="https://littlefootcraft.art/uploads/images/socialMedia_image.jpg"
  />

  <meta
    property="og:image:width"
    content="1024"
  />
  <meta
    property="og:image:height"
    content="1024"
  />
  <meta
    property="og:image:type"
    content="image/jpeg"
  />

  <meta
    property="og:url"
    content="https://littlefootcraft.art"
  />
  <meta
    property="og:site_name"
    content="LittleFootCraft"
  />

  <!-- Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />
  <meta
    name="twitter:title"
    content="LittleFootCraft"
  />
  <meta
    name="twitter:description"
    content="Handcrafted fantasy-inspired jewelry, brooches, and magical treasures."
  />
  <meta
    name="twitter:image"
    content="https://littlefootcraft.art/uploads/images/socialMedia_image.jpg"
  />

</head>

<body>
  <div id="root"></div>
  <script
    type="module"
    src="/src/main.jsx"
  ></script>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>

</html>
